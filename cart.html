<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RetroDiva - Carrito de Compras</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Permanent+Marker&family=Quicksand:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .cart-container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 2rem;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 10px;
            color: #fff;
        }

        .cart-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .cart-items {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .cart-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 1rem;
            border-radius: 8px;
            text-align: center;
        }

        .cart-item img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 4px;
            margin-bottom: 1rem;
        }

        .checkout-form {
            background: rgba(255, 255, 255, 0.1);
            padding: 2rem;
            border-radius: 8px;
            margin-top: 2rem;
        }

        .payment-methods {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin: 2rem 0;
        }

        .payment-method {
            background: rgba(255, 255, 255, 0.1);
            padding: 1rem;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .payment-method:hover {
            transform: scale(1.05);
        }

        .payment-method i {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .total-section {
            text-align: right;
            margin-top: 2rem;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
        }

        .total-section h3 {
            color: #00ff00;
            font-size: 1.5rem;
        }

        .checkout-button {
            width: 100%;
            padding: 1rem;
            background: #00ff00;
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .checkout-button:hover {
            background: #00cc00;
        }
    </style>
</head>
<body>
    <div class="cart-container">
        <div class="cart-header">
            <h1>Carrito de Compras</h1>
        </div>

        <div id="cart-items" class="cart-items">
            <!-- Los productos del carrito se agregarán dinámicamente con JavaScript -->
        </div>

        <div class="checkout-form">
            <h2>Métodos de Pago</h2>
            <div class="payment-methods">
                <div class="payment-method" onclick="selectPaymentMethod('tarjeta')">
                    <i class="fas fa-credit-card"></i>
                    <h3>Tarjeta de Crédito</h3>
                </div>
                <div class="payment-method" onclick="selectPaymentMethod('efectivo')">
                    <i class="fas fa-money-bill-wave"></i>
                    <h3>Efectivo</h3>
                </div>
                <div class="payment-method" onclick="selectPaymentMethod('transferencia')">
                    <i class="fas fa-exchange-alt"></i>
                    <h3>Transferencia</h3>
                </div>
            </div>

            <div class="total-section">
                <h3>Total: $<span id="cart-total">0.00</span></h3>
            </div>

            <button class="checkout-button" onclick="proceedToCheckout()">Proceder al Pago</button>
        </div>
    </div>

    <script>
        // Datos de productos
        const products = [
            {
                id: 1,
                name: 'Jumpsuit Neon',
                price: 199.99,
                image: 'img/product1.jpg',
                description: 'Jumpsuit con estampado neón y detalles retro'
            },
            {
                id: 2,
                name: 'Vestido Glam',
                price: 149.99,
                image: 'img/product2.jpg',
                description: 'Vestido con hombreras y estampado ochentero'
            },
            {
                id: 3,
                name: 'Top Glam',
                price: 79.99,
                image: 'img/product3.png',
                description: 'Top con detalles metalizados y hombreras'
            },
            {
                id: 4,
                name: 'Pantalones Power',
                price: 129.99,
                image: 'img/product4.jpg',
                description: 'Pantalones anchos con cintura alta y detalles brillantes'
            },
            {
                id: 5,
                name: 'Chaqueta Moto',
                price: 179.99,
                image: 'img/product5.jpg',
                description: 'Chaqueta de cuero sintético con hombreras y cierre de metal'
            },
            {
                id: 6,
                name: 'Falda Midi',
                price: 99.99,
                image: 'img/product6.jpg',
                description: 'Falda midi con estampado geométrico ochentero'
            },
            {
                id: 7,
                name: 'Crop Top',
                price: 69.99,
                image: 'img/product7.jpg',
                description: 'Crop top con mangas acampanadas y detalles brillantes'
            },
            {
                id: 8,
                name: 'Vestido Mini',
                price: 139.99,
                image: 'img/product8.jpg',
                description: 'Vestido mini con cuello alto y detalles de vinilo'
            },
            {
                id: 9,
                name: 'Blazer',
                price: 169.99,
                image: 'img/product9.jpg',
                description: 'Blazer con hombreras y botones dorados'
            },
            {
                id: 10,
                name: 'Body',
                price: 89.99,
                image: 'img/product10.jpg',
                description: 'Body con tirantes gruesos y detalles brillantes'
            }
        ];

        // Obtener los productos del carrito desde localStorage
        const cart = JSON.parse(localStorage.getItem('cart')) || [];
        
        // Renderizar los productos del carrito
        function renderCart() {
            const cartItems = document.getElementById('cart-items');
            const cartTotal = document.getElementById('cart-total');
            
            cartItems.innerHTML = '';
            let total = 0;

            cart.forEach(item => {
                const product = products.find(p => p.id === item.id);
                if (product) {
                    total += product.price * item.quantity;
                    
                    const cartItem = document.createElement('div');
                    cartItem.className = 'cart-item';
                    cartItem.innerHTML = `
                        <img src="${product.image}" alt="${product.name}">
                        <h3>${product.name}</h3>
                        <p>Cantidad: ${item.quantity}</p>
                        <p>Precio: $${(product.price * item.quantity).toFixed(2)}</p>
                    `;
                    cartItems.appendChild(cartItem);
                }
            });

            cartTotal.textContent = total.toFixed(2);
        }

        // Función para seleccionar método de pago
        function selectPaymentMethod(method) {
            alert(`Has seleccionado ${method} como método de pago`);
        }

        // Función para proceder al pago
        function proceedToCheckout() {
            if (cart.length === 0) {
                alert('No hay productos en el carrito');
                return;
            }

            const total = parseFloat(document.getElementById('cart-total').textContent);
            if (total <= 0) {
                alert('El total debe ser mayor a 0');
                return;
            }

            alert('¡Gracias por tu compra! Se ha procesado tu pedido.');
            localStorage.removeItem('cart');
            window.location.href = 'index.html';
        }

        // Renderizar el carrito al cargar la página
        document.addEventListener('DOMContentLoaded', renderCart);
    </script>
</body>
</html>
